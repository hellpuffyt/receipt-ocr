<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">receipt-ocr extraction pipeline</title>
  <desc id="d">An image goes through TesseractBackend, or pre-extracted OCR JSON goes through JsonBackend. Both produce a list of TextBlock objects. layout.group_into_lines builds lines, then the field extractors in fields.py (using money.py and dates.py) produce currency, vendor, date, total, tax and line items. The ExtractionResult carries a value, confidence and evidence per field, and the CLI prints it as JSON with a review queue of fields below --min-confidence.</desc>
  <rect width="1200" height="440" fill="#0C0D0D"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A3AAA6"/>
    </marker>
  </defs>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#A3AAA6">
    <text x="40" y="44" font-size="15" fill="#EEEAE2">receipt-ocr</text>
    <text x="160" y="44" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">OCR backend in, per-field value + confidence + evidence out</text>
  </g>

  <!-- inputs -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <rect x="40" y="96" width="190" height="92" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="56" y="124" fill="#EEEAE2">receipt.jpg / .png</text>
    <text x="56" y="148" fill="#A3AAA6">TesseractBackend</text>
    <text x="56" y="170" fill="#A3AAA6">pytesseract + binary</text>

    <rect x="40" y="232" width="190" height="92" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="56" y="260" fill="#EEEAE2">blocks.json</text>
    <text x="56" y="284" fill="#A3AAA6">JsonBackend</text>
    <text x="56" y="306" fill="#A3AAA6">stdlib only (CI path)</text>

    <!-- textblocks -->
    <rect x="290" y="150" width="190" height="120" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="306" y="178" fill="#EEEAE2">list[TextBlock]</text>
    <text x="306" y="204" fill="#A3AAA6">text, left, top,</text>
    <text x="306" y="226" fill="#A3AAA6">width, height,</text>
    <text x="306" y="248" fill="#A3AAA6">confidence, page</text>

    <!-- layout -->
    <rect x="540" y="150" width="170" height="120" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="556" y="178" fill="#EEEAE2">layout.py</text>
    <text x="556" y="204" fill="#A3AAA6">group_into_lines</text>
    <text x="556" y="226" fill="#A3AAA6">rows by center y,</text>
    <text x="556" y="248" fill="#A3AAA6">then left to right</text>

    <!-- fields -->
    <rect x="770" y="80" width="190" height="260" rx="6" fill="#17191A" stroke="#3FBF8A"/>
    <text x="786" y="108" fill="#EEEAE2">fields.py</text>
    <text x="786" y="136" fill="#A3AAA6">extract_currency</text>
    <text x="786" y="160" fill="#A3AAA6">extract_vendor</text>
    <text x="786" y="184" fill="#A3AAA6">extract_date</text>
    <text x="786" y="208" fill="#A3AAA6">extract_total</text>
    <text x="786" y="232" fill="#A3AAA6">extract_tax</text>
    <text x="786" y="256" fill="#A3AAA6">extract_line_items</text>
    <line x1="786" y1="276" x2="944" y2="276" stroke="#2A2E2D"/>
    <text x="786" y="300" fill="#A3AAA6">money.py  dates.py</text>
    <text x="786" y="322" fill="#A3AAA6">locale-aware parsing</text>

    <!-- result -->
    <rect x="1010" y="96" width="160" height="128" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="1026" y="122" fill="#EEEAE2">Extraction</text>
    <text x="1026" y="140" fill="#EEEAE2">Result</text>
    <text x="1026" y="166" fill="#A3AAA6">value</text>
    <text x="1026" y="188" fill="#A3AAA6">confidence 0-1</text>
    <text x="1026" y="210" fill="#A3AAA6">evidence blocks</text>

    <rect x="1010" y="250" width="160" height="90" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="1026" y="278" fill="#EEEAE2">review_queue</text>
    <text x="1026" y="302" fill="#A3AAA6">fields below</text>
    <text x="1026" y="324" fill="#A3AAA6">--min-confidence</text>
  </g>

  <g stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M230 142 H258 V190 H286"/>
    <path d="M230 278 H258 V230 H286"/>
    <path d="M480 210 H536"/>
    <path d="M710 210 H766"/>
    <path d="M960 160 H1006"/>
    <path d="M1090 224 V246"/>
  </g>

  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#A3AAA6">
    <line x1="290" y1="376" x2="960" y2="376" stroke="#2A2E2D"/>
    <text x="290" y="400">engine.extract_fields: pure Python, never imports an OCR library, tested with synthetic TextBlock fixtures</text>
    
  </g>
</svg>
