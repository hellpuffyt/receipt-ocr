[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-ocr"
version = "0.1.0"
description = "Extract structured fields (total, date, vendor, tax, line items) from receipt and invoice images, with a confidence score per field."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Prabesh Sharma" }]
requires-python = ">=3.10"
keywords = ["ocr", "receipt", "invoice", "tesseract", "bookkeeping", "document-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/hellpuffyt/receipt-ocr"
Repository = "https://github.com/hellpuffyt/receipt-ocr"

[project.scripts]
receipt-ocr = "receipt_ocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "PIL.*"]
ignore_missing_imports = true
